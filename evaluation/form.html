<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor's Information</title>
</head>

<body>
    <form method="post">
        <h2>Donor's Information</h2>
        <table>
            <tr>
                <td>
                    <label for="firstname*">firstname*</label>
                </td>
                <td>
                    <input type="text" id="firstname" name="firstname" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="lastname*">lastname*</label>
                </td>
                <td>
                    <input type="text" id="lastname" name="lastname" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="company">company</label>
                </td>
                <td>
                    <input type="text" id="company" name="company" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="address1*">address1*</label>
                </td>
                <td>
                    <input type="text" id="address1" name="address1" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="address2">address2</label>
                </td>
                <td>
                    <input type="text" id="address2" name="address2" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="city*">city*</label>
                </td>
                <td>
                    <input type="text" id="city" name="city" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="state*">state*</label>
                </td>
                <td>
                    <select id="state" name="state">
                        <option>Select a state</option>
                        <option>Chittagong</option>
                        <option>Rajshahi</option>
                        <option>Dhaka</option>
                        <option>khulna</option>
                        <option>Sylhet</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="zipcode">zipcode</label>
                </td>
                <td>
                    <input type="number" id="zipcode" name="zipcode" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="country">country</label>
                </td>
                <td>
                    <select id="country" name="country">
                        <option>Select a country</option>
                        <option>Denamrk</option>
                        <option>USA</option>
                        <option>UK</option>
                        <option>Albania</option>
                        <option>kenya</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="phone*">phone</label>
                </td>
                <td>
                    <input type="number" id="phone" name="phone">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="fax">fax</label>
                </td>
                <td>
                    <input type="number" id="fax" name="fax">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email*">email*</label>
                </td>
                <td>
                    <input type="text" id="email*" name="email*">
                </td>
            </tr>
            <tr>
                <td>
                    <label>donation Amount*(click abutton or typein your amount)
                </td>
                <td>
                    <input type="radio" name="donation" value="none">none
                    <input type="radio" name="donation" value="$50">$50
                    <input type="radio" name="donation" value="&75">$75
                    <input type="radio" name="donation" value="$100">$100
                    <input type="radio" name="donation" value="$250">$250
                    <input type="radio" name="donation" value="other">others
                </td>
            <tr>
                <td>
                    <label for="otheramount">otheramount</label>
                </td>
                <td>
                    <input type="number" id="otheramount" name="otheramount">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="recurringdonation">recurring donation(check if yes)</label>
                </td>
                <td>
                    <input type="checkbox" value="recurrindonation">I am interested in giving on a regular basis
                </td>
            </tr>
            <tr>
                <td>
                    <label for="monthlycreditcard">monthlycreditcard</label>
                    <input type="number" id="monthlycreditcard" name="fax">
                    <label for="monthlycreditcard">for</label>
                    <input type="number" id="monthlycreditcard" name="monthlycreditcard">
                    <label>Months</label>
                </td>
            </tr>


            </tr>

            </tr>


</body>

</html>
